<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101213">
<meta name="description" content="Álbum de cumpleaños para Abel Coras Borda.">
<meta property="og:type" content="website">
<meta property="og:title" content="¡Feliz cumpleaños, Abel Coras Borda! 🏍️">
<meta property="og:description" content="Una sorpresa en fotografías, hecha especialmente para Abel.">
<meta property="og:image" content="https://ayarang.github.io/simulador-de-jugos/tarjeta-cumpleanos/assets/album-abel.webp">
<title>Abel Coras Borda · Álbum de cumpleaños 🏍️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="assets/album-abel.webp" as="image" type="image/webp">
<style>
:root{color-scheme:dark;--black:#0c0f11;--ash:#24272a;--smoke:#9ba1a4;--orange:#fa9a3f;--paper:#f5f2e8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100svh;overflow-x:hidden;background:#0c0f11;color:var(--paper);font:400 15px/1.6 "DM Sans",sans-serif}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
img{display:block;max-width:100%}
a{color:inherit}
#burst{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}
.layout{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse 75% 55% at 50% 25%,#383b3f70,transparent 75%),radial-gradient(ellipse 70% 85% at 100% 100%,#38201170,transparent 75%),#0c0f11}
.layout::before{content:"";position:absolute;inset:0;z-index:0;opacity:.13;pointer-events:none;background:repeating-linear-gradient(122deg,transparent 0 42px,#adb0ad 43px,#adb0ad 44px,transparent 45px 88px);mask-image:linear-gradient(90deg,#000,transparent 35%,transparent 65%,#000)}
.layout::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.14;background:radial-gradient(circle at 27% 17%,#ffad60,transparent 4%),radial-gradient(circle at 85% 85%,#ffae61,transparent 6%)}
.topbar{position:relative;z-index:2;max-width:1120px;margin:auto;padding:23px clamp(18px,5vw,50px);display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.19em;font-weight:800;text-transform:uppercase;color:#e9e2d6}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--orange);color:#1b1c1b;border-radius:50% 50% 40% 40%;font-size:18px;box-shadow:0 0 22px #ff9d4b4d}
.topbar .edition{font-size:10px;color:#d79f67;font-weight:800;letter-spacing:.19em;text-transform:uppercase;text-align:right}
.cover{min-height:calc(100svh - 83px);position:relative;z-index:1;display:grid;place-items:center;padding:30px 20px 65px;text-align:center}
.cover-inner{width:min(100%,930px)}
.cover-eyebrow{color:#eba45a;letter-spacing:.3em;text-transform:uppercase;font-size:10px;font-weight:800;margin:0 0 7px}
.cover h1{font:900 clamp(79px,16vw,180px)/.79 "Barlow Condensed",Impact,sans-serif;letter-spacing:-.04em;color:#f4f1eb;margin:15px auto 0}
.cover h1 span{display:block;background:linear-gradient(110deg,#f1f0e9,#d6ddd9);background-clip:text;-webkit-background-clip:text;color:transparent}
.cover h1 .surname{font-size:clamp(30px,6.2vw,69px);line-height:1.1;letter-spacing:.025em;margin-top:17px;color:#e1a364;background:none}
.rule{width:76px;height:3px;border-radius:30px;margin:20px auto 20px;background:linear-gradient(90deg,#ce7943,#ffb567)}
.cover-sub{font-size:11px;color:#aba9a6;letter-spacing:.26em;text-transform:uppercase;font-weight:800}
.thumb-frame{position:relative;max-width:255px;margin:23px auto 23px;filter:drop-shadow(0 15px 26px #000a);transform:rotate(-5deg);transition:transform .4s}
.thumb-frame::before{content:"";position:absolute;z-index:-1;inset:-10px;border:1px solid #ff9d51a6;transform:rotate(8deg)}
.thumb-frame img{border:5px solid #e9e1d0;width:100%;aspect-ratio:4/5;object-fit:cover;filter:saturate(.78) brightness(.75)}
.cover:hover .thumb-frame{transform:rotate(-2deg) translateY(-2px)}
.cta{border:0;border-radius:100px;padding:15px 28px;min-height:54px;display:inline-flex;align-items:center;gap:14px;justify-content:center;background:linear-gradient(112deg,#ffb875,#ed8c3d);color:#101313;font-weight:900;box-shadow:0 12px 35px #0009,0 0 32px #fa983c36;transition:transform .2s,filter .2s}
.cta:hover{transform:translateY(-2px);filter:brightness(1.06)}
.cta:active{transform:translateY(1px)}
.cta span{font-size:19px}
.cover-foot{margin-top:18px;font-size:10px;color:#7b8282;letter-spacing:.14em}
.album{position:relative;z-index:2;min-height:100svh;padding:5px 18px 68px;display:flex;flex-direction:column;align-items:center;text-align:center}
.album-head{padding:11px 5px 10px}
.album-head .overline{display:block;color:#e79e58;font-size:10px;font-weight:800;letter-spacing:.29em;text-transform:uppercase}
.album-head h2{font:800 clamp(37px,8vw,70px)/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:7px 0 0}
.album-head h2 span{color:#f7a052}
.album-image{position:relative;isolation:isolate;width:min(100%,550px);margin:25px auto 13px;border:1px solid #e6984c8a;padding:6px;background:#202325;box-shadow:0 26px 80px #000c,0 0 70px #fa883316}
.album-image::before{content:"";position:absolute;inset:-16px;z-index:-1;background:linear-gradient(125deg,#d1824d55,#6c6c6c33,#ca7b3b44);filter:blur(26px)}
.album-image img{display:block;width:100%;height:auto;aspect-ratio:561/701;object-fit:contain}
.album-actions{display:flex;gap:11px;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px auto 0}
.secondary{border:1px solid #f7a75b65;background:#252627;color:#e8ded1;border-radius:100px;padding:12px 19px;min-height:44px;font-size:12px;font-weight:800;transition:background .2s}
.secondary:hover{background:#3a3530}
.credit{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#848787;margin:24px auto 0}
.toast{position:fixed;z-index:70;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#1c1c1b;background:#ffb471;border-radius:100px;padding:11px 20px;white-space:nowrap;box-shadow:0 12px 40px #0008}
.album.show{animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:450px){.topbar{padding:18px 17px}.brand{font-size:10px;letter-spacing:.12em}.topbar .edition{font-size:9px}.cover{padding:10px 17px 54px}.cover h1{font-size:clamp(74px,23vw,112px)}.cover h1 .surname{font-size:clamp(27px,9vw,45px)}.thumb-frame{max-width:195px;margin-top:20px;margin-bottom:23px}.album-head h2{font-size:clamp(38px,12vw,58px)}.album-image{margin-top:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.album.show,.thumb-frame,.cta{animation:none;transition:none}}
</style>
</head>
<body>
<canvas id="burst" aria-hidden="true"></canvas>
<div class="layout">
 <header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span>EDICIÓN ESPECIAL</div>
  <div class="edition">ÁLBUM DE CUMPLEAÑOS<br>🏍️</div>
 </header>
 <section class="cover" id="cover" aria-labelledby="cover-name">
  <div class="cover-inner">
   <p class="cover-eyebrow">Feliz cumpleaños</p>
   <h1 id="cover-name"><span>ABEL</span><span class="surname">CORAS BORDA</span></h1>
   <div class="rule"></div>
   <p class="cover-sub">Un álbum especial para ti</p>
   <div class="thumb-frame" aria-hidden="true"><img src="assets/album-abel.webp" width="1122" height="1402" alt="" fetchpriority="high"></div>
   <button class="cta" id="open-album" type="button">Abrir álbum <span aria-hidden="true">↗</span></button>
   <p class="cover-foot">UNA SORPRESA EN FOTOGRAFÍAS</p>
  </div>
 </section>
 <main class="album" id="album" hidden aria-labelledby="album-title">
  <div class="album-head"><span class="overline">EDICIÓN DE CUMPLEAÑOS</span><h2 id="album-title" tabindex="-1">¡Feliz cumpleaños, <span>Abel!</span></h2></div>
  <figure class="album-image"><img src="assets/album-abel.webp" width="1122" height="1402" alt="Álbum de Abel Coras Borda: cuatro fotos de su aventura en la montaña en un collage con diseño inspirado en motos." decoding="async"></figure>
  <div class="album-actions">
   <button class="cta" type="button" id="again">¡Otra vez! <span aria-hidden="true">✦</span></button>
   <button class="secondary" type="button" id="share">Compartir ↗</button>
   <button class="secondary" type="button" id="return">Volver al inicio ↺</button>
  </div>
  <p class="credit">ABEL CORAS BORDA · ÁLBUM FOTOGRÁFICO</p>
 </main>
</div>
<p class="toast" id="toast" role="status" hidden></p>
<script>
(() => {
 const $=id=>document.getElementById(id);
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const cover=$('cover'),album=$('album'),canvas=$('burst'),ctx=canvas.getContext('2d');
 let particles=[],frame=0,noticeTimer=0;
 function resize(){const d=Math.min(window.devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);}
 resize();addEventListener('resize',resize,{passive:true});
 function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  particles=particles.filter(p=>p.life>0&&p.y<innerHeight+35);
  for(const p of particles){p.life--;p.vy+=.10;p.x+=p.vx;p.y+=p.vy;p.rot+=p.spin;ctx.save();ctx.globalAlpha=Math.min(1,p.life/43);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
  if(particles.length)frame=requestAnimationFrame(tick);else{frame=0;ctx.clearRect(0,0,innerWidth,innerHeight)}
 }
 function burst(){
  if(reduce||!ctx)return;
  const colors=['#f9a151','#f4d3a2','#f5f5ee','#77a7a1','#e8a962'];
  for(let i=0;i<130;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*7;particles.push({x:innerWidth/2,y:Math.min(innerHeight*.25,210),vx:Math.cos(a)*v,vy:Math.sin(a)*v-3.8,rot:Math.random()*6.3,spin:(Math.random()-.5)*.17,w:3+Math.random()*6,h:4+Math.random()*11,life:75+Math.random()*75,color:colors[i%colors.length]});}
  if(!frame)frame=requestAnimationFrame(tick);
 }
 function show(){cover.hidden=true;album.hidden=false;album.classList.add('show');window.scrollTo({top:0,behavior:'instant'});$('album-title').focus({preventScroll:true});burst();}
 $('open-album').addEventListener('click',show);
 $('again').addEventListener('click',burst);
 $('return').addEventListener('click',()=>{album.hidden=true;album.classList.remove('show');cover.hidden=false;window.scrollTo({top:0,behavior:'instant'});$('open-album').focus({preventScroll:true})});
 function notice(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.hidden=true,3000)}
 $('share').addEventListener('click',async()=>{
  const data={title:'Álbum de cumpleaños para Abel Coras Borda',text:'¡Feliz cumpleaños, Abel! 🏍️',url:location.href.split('#')[0]};
  if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(data.url);notice('¡Enlace copiado!');return}catch(e){}
  window.prompt('Copia el enlace:',data.url);
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;particles=[];ctx.clearRect(0,0,innerWidth,innerHeight)}});
})();
</script>
</body>
</html>
